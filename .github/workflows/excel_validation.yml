name: Excel Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  validate-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate apartment workbook with broad and deep review
        env:
          APARTMENT_EXCEL_PATH: "Central_NJ_Apartment_Comparison_WITH_TOUR_CLUSTERS_FINAL.xlsx"
          MAX_PRICE: "3200"
          COMMUTE_LIMIT: "30"
          MIN_BEDS: "2"
          MIN_BATHS: "2"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python excel_validator.py

      - name: Commit corrected workbook if needed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add "Central_NJ_Apartment_Comparison_WITH_TOUR_CLUSTERS_FINAL.xlsx"
          if git diff --cached --quiet; then
            echo "No workbook changes to commit."
            exit 0
          fi
          git commit -m "Validate and normalize apartment workbook [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
