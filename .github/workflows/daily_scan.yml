name: Daily Rental Scan

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  rental-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run rental notifier
        env:
          RENT_SENDER_EMAIL: ${{ secrets.RENT_SENDER_EMAIL }}
          RENT_SENDER_PASSWORD: ${{ secrets.RENT_SENDER_PASSWORD }}
        run: |
          python notify_agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rental_database.csv sent_listings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update rental database and history [skip ci]" && git push)
