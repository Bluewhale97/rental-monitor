name: Daily Rental Scan

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  rental-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run rental notifier
        env:
          RENT_SENDER_EMAIL: ${{ secrets.RENT_SENDER_EMAIL }}
          RENT_SENDER_PASSWORD: ${{ secrets.RENT_SENDER_PASSWORD }}
        run: |
          python notify_agent.py
