name: Daily Rental Scan

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  rental-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Run rental notifier
        env:
          RENT_SENDER_EMAIL: ${{ secrets.RENT_SENDER_EMAIL }}
          RENT_SENDER_PASSWORD: ${{ secrets.RENT_SENDER_PASSWORD }}
          RENT_RECEIVER_EMAILS: ${{ secrets.RENT_RECEIVER_EMAILS }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEARCH_PROVIDER: "tavily"
          AI_LIVE_SEARCH_ENABLED: "true"
          SEARCH_LOCATION: "Bridgewater, NJ"
          SEARCH_AREAS: "Bridgewater, NJ; Somerset County, NJ"
          MIN_BEDS: "2"
          MAX_PRICE: "3200"
          COMMUTE_LIMIT: "30"
          MOVE_IN_DATE: "2026-10-31"
        run: |
          test -n "$TAVILY_API_KEY" || (echo "Missing GitHub secret: TAVILY_API_KEY" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "Missing GitHub secret: OPENAI_API_KEY for deep property extraction" && exit 1)
          test -n "$RENT_SENDER_EMAIL" || (echo "Missing GitHub secret: RENT_SENDER_EMAIL" && exit 1)
          test -n "$RENT_SENDER_PASSWORD" || (echo "Missing GitHub secret: RENT_SENDER_PASSWORD" && exit 1)
          test -n "$RENT_RECEIVER_EMAILS" || (echo "Missing GitHub secret: RENT_RECEIVER_EMAILS" && exit 1)
          python notify_agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rental_database.csv sent_listings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update rental database and history [skip ci]" && git push)
